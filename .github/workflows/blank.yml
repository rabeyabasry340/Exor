name: Import project zip into repo

on:
  workflow_dispatch:
    inputs:
      project_zip_url:
        description: 'Direct download URL of ExorMediaServer zip'
        required: true
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download and extract zip into Exor_app
        run: |
          curl -L -o project.zip "${{ inputs.project_zip_url }}"
          rm -rf /tmp/extracted Exor_app
          mkdir -p /tmp/extracted
          unzip -q project.zip -d /tmp/extracted

          if [ -d /tmp/extracted/ExorMediaServer ]; then
            SRC=/tmp/extracted/ExorMediaServer
          else
            SRC=/tmp/extracted
          fi

          echo "Copying from $SRC into Exor_app/"
          mkdir -p Exor_app
          cp -a "$SRC"/. Exor_app/
          rm -rf Exor_app/.gradle Exor_app/app/build Exor_app/.kotlin Exor_app/local.properties
          rm -f project.zip

          if [ -f Exor_app/gradle.properties ]; then
            sed -i '/org.gradle.java.home/d' Exor_app/gradle.properties
            sed -i '/MaxMetaspaceSize/d' Exor_app/gradle.properties
          fi

          echo "=== Exor_app contents ==="
          ls -la Exor_app

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Exor_app
          git status
          if git diff --staged --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Import project into Exor_app/"
            git push
          fi
