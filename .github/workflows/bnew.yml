name: Build Exor Media Server APK v1

on:
  workflow_dispatch:
    inputs:
      project_zip_url:
        description: 'Direct download URL of ExorMediaServer zip (GitHub Release asset link)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (dummy – we use the uploaded zip)
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Download project zip
        run: |
          echo "Downloading from: ${{ inputs.project_zip_url }}"
          curl -L -o project.zip "${{ inputs.project_zip_url }}"
          unzip -q project.zip -d project
          # Find the real project root (handles zip with or without top folder)
          if [ -d project/ExorMediaServer ]; then
            echo "PROJECT_DIR=project/ExorMediaServer" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=project" >> $GITHUB_ENV
          fi
          ls -la $PROJECT_DIR

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > $PROJECT_DIR/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x $PROJECT_DIR/gradlew || true

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExorMediaServer-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Show APK info
        run: |
          echo "=== Built APK ==="
          ls -lh $PROJECT_DIR/app/build/outputs/apk/debug/
